spring.application.name=securitylab

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/securitylab}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:ChangeThisToAStrongRandomJwtSecretKeyValue1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
