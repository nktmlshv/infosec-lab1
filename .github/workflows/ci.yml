name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-security-check:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ThisIsAValidJWTSecretKeyForLocalLab123456' }}
      APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD || 'StrongAdminPassword123!' }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DB_URL: jdbc:postgresql://localhost:5432/securitylab
      DB_USERNAME: appuser
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: securitylab
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d securitylab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run build and security checks
        run: ./mvnw -B verify

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
