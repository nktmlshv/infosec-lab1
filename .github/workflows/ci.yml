name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-security-check:
    runs-on: ubuntu-24.04

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ThisIsAValidJWTSecretKeyForLocalLab123456' }}
      APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD || 'StrongAdminPassword123!' }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DB_URL: jdbc:postgresql://localhost:5432/securitylab
      DB_USERNAME: appuser
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: securitylab
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appuser -d securitylab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository/org/owasp/dependency-check-data
            ~/.m2/repository/org/owasp/dependency-check
          key: dependency-check-${{ runner.os }}-v1
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: SAST - SpotBugs
        run: ./mvnw -B clean compile spotbugs:check

      - name: SCA - Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B org.owasp:dependency-check-maven:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
