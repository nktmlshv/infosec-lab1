services:
  db:
    image: postgres:16-alpine
    container_name: securitylab-db
    environment:
      POSTGRES_DB: securitylab
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d securitylab"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: securitylab-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/securitylab
      DB_USERNAME: appuser
      DB_PASSWORD: secret
      JWT_SECRET: "ChangeThisToAStrongRandomJwtSecretKeyValue1234567890"
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
